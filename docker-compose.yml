# AME Agent Chat — Agent コンテナ構成 (要件 #1 §2.4, §2.6)
# Frontend (51730) と Gatekeeper (87880) はホスト側で起動。
# コンテナ内では Agent Core (30010) + OpenCode Server (40960・非公開) が同居。
name: ame-agent-chat

services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ame-agent
    # ホストワークスペースを /workspace へ bind mount (要件 #1 §2.4)
    volumes:
      - ${WORKSPACE_DIR:-.}:/workspace
    ports:
      # Frontend(ホスト) -> Agent Core(BFF) — 要件 #1 §2.6
      - '30010:30010'
      # OpenCode Server はコンテナ内のみ (非公開) — 要件 #1 §2.6
    environment:
      OPENCODE_BASE_URL: http://localhost:40960
      GATEKEEPER_URL: http://host.docker.internal:87880
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:51730}
    # Outbound(Egress) 許可 — pip/npm install 自律解決 (要件 #1 §3.3.2) は既定で許可
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:30010/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
