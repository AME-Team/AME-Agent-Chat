---
# AME AI Review System — pre-commit profile: full
# Python + Node + Shell + 設定ファイル + Secret + AI レビューの包括セット。
# (各フックの実行には対応ツールのインストールが必要。不要なフックは削除してよい)
minimum_pre_commit_version: "4.0.0"
# post-commit は下記 ai-review-state-reset フック（stages: [post-commit]）に必要。
# デフォルトでは pre-commit install で post-commit が入らないため明示指定する。
# 既存クローンで pre-commit install 済みの場合は再実行が必要:
#   pre-commit install -t pre-commit -t post-commit
default_install_hook_types: [pre-commit, post-commit]
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Issue #69: lockfile の圧縮トークンを typo と誤検知するため除外。
        # engines-ts の TS 側エンジン (SDK ベース) も誤検知回避のため除外。
        exclude: "(pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock)$|^\\.ame-review/engines-ts/"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        # Issue #69: lockfile (数千行・長行) は yamllint --strict で大量エラーになるため除外。
        exclude: "(pnpm-lock\\.yaml|.*-lock\\.(yaml|json)|yarn\\.lock)$"

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # pre-commit が `language: python` の venv へ wheel を自動導入するため、
  # 絶対パスのハードコードは不要（各環境で解決される）。
  # 注意: 初回実行時のみ GitHub Releases の wheel 取得にネットワークが必要
  # （以降は pre-commit が環境をキャッシュ）。オフライン/制限環境では、
  # wheel をあらかじめ pip install した Python をフックに使うこと
  # （entry を python -m ame_ai_review_system.* にして language: system で実行）。
  # Gate 1 は wheel を単一情報源とする（#sha256 固定）。パッケージ本体の管理は
  # 上流リポジトリ（tarminjapan/AME-AI-Review-System）の wheel 配布に集約し、
  # 本リポジトリにはコピーを保持しない。
  # wheel は供給チェーン対策のため #sha256= で内容を固定する（3 フックで共通）。
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: python -m ame_ai_review_system.skip_guard
        language: python
        additional_dependencies: &ame-wheel-dep
          - ame_ai_review_system @ https://github.com/tarminjapan/AME-AI-Review-System/releases/download/v0.2.4/ame_ai_review_system-0.2.4-py3-none-any.whl#sha256=7173ff47a61c1abff9b6090025786a06aca949bb34dfb3e89048bb817395651d
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: python -m ame_ai_review_system.precommit_review
        language: python
        additional_dependencies: *ame-wheel-dep
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: python -m ame_ai_review_system.post_commit_reset
        language: python
        additional_dependencies: *ame-wheel-dep
        pass_filenames: false
        always_run: true
        stages: [post-commit]
