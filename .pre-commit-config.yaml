---
# AME AI Review System — pre-commit profile: ts
# 本リポジトリは TypeScript モノレポのため `ts` プリセット (auto 検出に相当) を適用する。
# eslint / prettier はプロジェクトローカルの node_modules/.bin を直接起動するため、
# 事前に `pnpm install` が必要。stylelint は本リポジトリ未導入のため省略している。
# Python 系 (ruff/mypy)・Shell (shellcheck) は対象ソースが無いため含めない。
#   (リポジトリ全体で .py / .sh が存在しないことを確認済み — 2026-08)
#   ※ docker/Dockerfile の「将来フェーズで Python/C#/Go/C++ を追加 (要件 #3.3.1)」の通り、
#     Python ソース導入時 (S2) は ruff/mypy (と CI 側の該当ステップ) を再導入すること。
minimum_pre_commit_version: '4.0.0'
# Issue #82: ai-review-state-reset (stages: [post-commit]) が standard install で
# 入るよう post-commit を明示する。既存クローンで pre-commit install 済みの場合は
# 再実行が必要:
#   pre-commit install -t pre-commit -t post-commit
default_install_hook_types: [pre-commit, post-commit]
fail_fast: true

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Issue #69: lockfile の圧縮トークンを typo と誤検知するため除外。
        # Issue #80: .ame-review/engines-ts/ (TS 側エンジン SDK) も誤検知回避のため除外。
        exclude: "(pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock)$|^\\.ame-review/engines-ts/"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        # Issue #69: lockfile (数千行・長行) は yamllint --strict で大量エラーになるため除外。
        exclude: "(pnpm-lock\\.yaml|.*-lock\\.(yaml|json)|yarn\\.lock)$"

  - repo: local
    hooks:
      # eslint / prettier は node_modules の .bin を起動するため、fresh clone 直後に
      # pnpm install を実行していない場合は先に実行を案内する (fail_fast で Gate 1 全体が
      # 無効化されないためのガード)。あわせて eslint --no-warn-ignored に必要な >=9.20 を
      # scripts/check-eslint-version.mjs で検査する (インラインの複雑なクォートを避ける)。
      - id: node-modules-check
        name: check node_modules (pnpm install)
        entry: >-
          bash -c 'test -x ./node_modules/.bin/eslint && test -x ./node_modules/.bin/prettier ||
          { echo "node_modules が未導入です。先に pnpm install を実行してください。"; exit 1; };
          node ./scripts/check-eslint-version.mjs'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # eslint はフラット設定 (eslint.config.mjs) で動作。
      # 注意: 上流 ts プリセット標準構成 (language: system + ./node_modules/.bin) に従う。
      # Windows では pre-commit が Git for Windows の bash 経由でフックを実行するため、
      # pnpm install が生成する .bin シムが解決される (事前に `pnpm install` 必須)。
      # 除外対象は eslint.config.mjs の ignores を単一情報源とし、--no-warn-ignored で尊重する
      # (Gate 1 / Gate 2 の検出範囲を一致させる。prettier 側は明示ファイルが .prettierignore を
      #  優先しないため exclude を明示する)。
      # ※ --no-warn-ignored は ESLint 9.20+ のフラグ。lockfile は 9.39.5 に固定済み。
      - id: eslint
        name: eslint (TypeScript)
        entry: ./node_modules/.bin/eslint --max-warnings=0 --no-warn-ignored
        language: system
        # types: [ts] は .tsx を対象外にするため types_or で両対応する (Issue #69)。
        # CI (pnpm lint = eslint .) と対象を揃えるため .js/.mjs/.cjs (identify: 'javascript') と .jsx も含める。
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: true
        stages: [pre-commit]

      - id: prettier
        name: prettier (format check)
        entry: ./node_modules/.bin/prettier --check
        language: system
        # 注意: identify のタグは .js -> 'javascript' のため 'js' ではなく 'javascript' を使う
        # (上流 v0.2.4 テンプレートは 'js' を含み pre-commit validate-config に失敗する — 報告予定)
        types_or: [ts, tsx, javascript, jsx, json, css, scss, yaml, markdown, html, vue, svg]
        # Issue #69: lockfile は整形規則と一致しないため除外。
        # Issue #80: .ame-review/engines-ts/ も整形対象外。
        # prettier は明示指定ファイルに対して .prettierignore を優先しないため、
        # .prettierignore 相当 (dist/build/*.min.js) もフック側で除外して CI と検出範囲を揃える。
        exclude: >-
          (pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$|^\.ame-review/engines-ts/|
          (^|/)(dist|build)/|\.min\.js$
        pass_filenames: true
        stages: [pre-commit]

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # pre-commit が `language: python` の venv へ wheel を自動導入するため、
  # 絶対パスのハードコードは不要 (各環境で解決される)。初回実行時のみ
  # GitHub Releases の wheel 取得にネットワークが必要 (以降はキャッシュ)。
  # オフライン/制限環境では `ame-ai-reviewer init --python <path>` を使うと
  # `language: system` で生成され、事前に導入した Python で実行される。
  # 供給チェーン対策として wheel は `#sha256=` で内容を固定する (Issue #84)。
  # 各フックの additional_dependencies は常に同一に保つこと (init 生成時は単一の
  # 定義から全フックへ一律展開される。手動編集時は 3 フックすべてを揃えること)。
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: 'AI review skip guard (Issue #26)'
        entry: python -m ame_ai_review_system.skip_guard
        language: python
        additional_dependencies: &ame-wheel-dep
          - ame_ai_review_system @ https://github.com/tarminjapan/AME-AI-Review-System/releases/download/v0.2.4/ame_ai_review_system-0.2.4-py3-none-any.whl#sha256=7173ff47a61c1abff9b6090025786a06aca949bb34dfb3e89048bb817395651d
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: 'AI Code Review (pre-commit)'
        entry: python -m ame_ai_review_system.precommit_review
        language: python
        additional_dependencies: *ame-wheel-dep
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: 'AI review state reset (post-commit)'
        entry: python -m ame_ai_review_system.post_commit_reset
        language: python
        additional_dependencies: *ame-wheel-dep
        pass_filenames: false
        always_run: true
        stages: [post-commit]
