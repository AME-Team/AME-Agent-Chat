# supervisord — OpenCode Server + Agent Core 同居起動 (要件 #1 §2.4)
# Debian 既定 config(/run 配下の sock 等・root 前提)に依存せず自己完結。
# 非 root ユーザ(node)で起動できるよう sock/log は /tmp 配下へ配置。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:opencode]
command=opencode serve --port 40960 --hostname 127.0.0.1
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:agent-core]
command=pnpm --filter @ame-agent-chat/agent-core start
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
