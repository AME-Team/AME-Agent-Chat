# supervisord — OpenCode Server + Agent Core 同居起動 (要件 #1 §2.4)
# OpenCode Server (40960・コンテナ内のみ) と Agent Core (30010・公開) を同居。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:opencode]
command=opencode serve --port 40960 --hostname 127.0.0.1
directory=/workspace
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:agent-core]
command=pnpm --filter @ame-agent-chat/agent-core start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
